<!Doctype html>
<html>
    <head> 
        <title> Table</title>
        </head>

<body>

    <table> 
        <caption> Mobile Store</caption>
        <thead>
            <tr>
                <th scope="col"> Product</th>
                <th scope="col"> Brand</th> 
                <th scope="col"> Price</th>
                
            </tr>
        </thead>
        <tbody>
            <tr>
            <th scope="row">Galaxy A55</th>
            <td> Samsung</td>
            <td> 35000 </td>
            </tr>

            <tr>
                <th scope="row">iPhone 15</th>
                <td> Apple</td>
                <td> 60000</td>
            </tr>

            <tr>
                <th scope="row"> Nord CE 4</th>
                <td> Oneplus</td>
                <td> 25000</td>
            </tr>
        </tbody>
    </table>
</body>

</html>
